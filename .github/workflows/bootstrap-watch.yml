# Watches the live entry page against the files of the latest release tag.
#
# The bootstrap is the one piece of this project's code a browser ever loads
# from a server. Everything else — the interface, the API, the video — comes
# from the user's own machine over a connection that page sets up. So the honest
# mitigation for "what if the server serves something else" is not a promise; it
# is that the bytes are few, identical for everyone, published with their
# digests, and compared on a schedule by something that is not the server.
#
# This is that comparison. It fetches every bootstrap file from the rendezvous
# host and requires it to be byte-identical to the same file at the latest v*
# tag, read from this repository rather than from any web host.
#
# Be precise about what it buys, because it is easy to overstate:
#
#   it catches   a rendezvous box serving modified bytes to everyone, within
#                the interval below.
#
#   it does NOT  catch a box that serves the good bytes to whoever is checking
#   catch        and different ones to a chosen victim. Nothing an outsider can
#                run catches that. The comparison covers the untargeted case,
#                which is nearly all of them, and it is not a guarantee.
#
# A failure here is not automatically an attack — the far more likely cause is a
# deploy caught halfway, which is why a mismatch is retried before it is
# believed. What it always means is that the published record and the live site
# disagree, and that is worth a human looking.
#
# The live host follows TAGS, not main: deploy-prod.sh moves the production box
# to a release tag. So the file list and the expected bytes come from the latest
# v* tag, and a file that exists on main but is not yet released is, correctly,
# not expected. The reference used to be the GitHub Pages copy at
# app.moonlightweb.top, but that name sits under the same domain as the live
# host, so whoever controls the domain could make the two agree. The repository
# is the one copy outside it.
#
# Only v* tags count. A srv-* tag (a server-only correction between releases,
# see pages.yml) that changes bootstrap/ makes this check fail until the next
# v* tag carries the same files.
name: bootstrap-watch

on:
  schedule:
    # Every 6 hours. GitHub runs scheduled jobs on a best-effort basis and
    # skews them under load, so treat the interval as "about 6 hours", not
    # as a guarantee — the window an unnoticed swap could live in is the honest
    # number to quote, and it is larger than the cron line suggests. This only
    # bounds the untargeted case (see the header comment); tightening it below
    # 30 minutes bought nothing precision-wise, and the repo is public so the
    # old interval cost nothing either — 6 hours was chosen purely to cut how
    # often a stale-tag false alarm (or a real one) pages a human, not because
    # a wider window was judged safe on its own merits.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-watch
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      LIVE: https://stream.moonlightweb.top
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the latest release tag is what the live page must match

      - name: Compare the live entry page against the latest release tag
        run: |
          set -uo pipefail

          # The file list and the expected bytes come from the latest v* tag
          # rather than from any host: a host that decides what it is checked
          # on is not being checked. CNAME is Pages plumbing, not served live.
          tag=$(git tag --list 'v*' --sort=-creatordate | head -1)
          echo "release tag: $tag"

          # grep selects nothing when that tag carries no bootstrap/, exits 1,
          # and pipefail ends the step on the assignment itself: a red run with
          # no output at all, which reads like a comparison that failed when in
          # truth none was ever made. Take the failure and name it. An empty
          # list means the newest tag predates bootstrap/ — or that there is no
          # tag — so there is no file to verify, and a check with nothing to
          # verify is broken, not reassuring.
          files=$(git ls-tree -r --name-only "$tag" bootstrap \
                  | sed 's|^bootstrap/||' | grep -vx CNAME | sort) || true
          if [ -z "$files" ]; then
            echo "::error::no bootstrap/ files at '${tag:-no release tag}' — the live entry page was NOT compared against anything. The live host follows release tags, so this clears once a v* tag carrying bootstrap/ is pushed."
            exit 1
          fi

          # Assign, then override on failure: a failed curl still feeds an empty
          # stream to sha256sum, which happily hashes nothing. Reporting that
          # hash as if it were the file is how a check quietly stops checking.
          fetch() {  # fetch <base> <path> -> sha256, or the word "unreachable"
            out=$(curl -fsS --max-time 20 --retry 2 --retry-delay 3 "$1/$2" \
                  | sha256sum | cut -d' ' -f1) || out=unreachable
            printf '%s' "$out"
          }

          compare() {
            bad=0
            for f in $files; do
              live=$(fetch "$LIVE" "$f")
              # The tagged bytes, straight from git: no host's answer decides
              # the outcome. A failed read must not pass for an empty file.
              ref=$(git show "$tag:bootstrap/$f" | sha256sum | cut -d' ' -f1) || ref=unreadable
              if [ "$live" = "$ref" ] && [ "$live" != unreachable ]; then
                printf 'ok    %-20s %s\n' "$f" "${live:0:16}"
              else
                printf 'DIFF  %-20s live=%s %s=%s\n' "$f" "${live:0:16}" "$tag" "${ref:0:16}"
                bad=1
              fi
            done
            # The root names the scripts were first published under are
            # permanent aliases of the v1 files on the live host (every
            # installed machine's application imports /tunnel.js by that
            # name). The tag has no copy under those names, so this is
            # checked live-to-live.
            for f in boot.js tunnel.js pairing.js frame-guard.js; do
              alias=$(fetch "$LIVE" "$f")
              real=$(fetch "$LIVE" "v1/$f")
              if [ "$alias" = "$real" ] && [ "$alias" != unreachable ]; then
                printf 'ok    %-20s = v1/%s\n' "/$f" "$f"
              else
                printf 'DIFF  %-20s alias=%s v1=%s\n' "/$f" "${alias:0:16}" "${real:0:16}"
                bad=1
              fi
            done
            return $bad
          }

          # A deploy in flight is the ordinary explanation for a mismatch: the
          # box takes minutes to move to a new tag. Give it time to settle
          # before calling it anything else.
          if compare; then
            echo "the live entry page matches $tag"
            exit 0
          fi

          echo "::warning::mismatch — waiting 120s in case a deploy is in flight"
          sleep 120

          if compare | tee "$GITHUB_STEP_SUMMARY"; then
            echo "matched on the second pass — a deploy was in flight"
            exit 0
          fi

          echo "::error::the live entry page does not match $tag"
          exit 1
